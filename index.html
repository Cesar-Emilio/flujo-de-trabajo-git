<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Misión DOM - Generador de Paleta</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f2f2f2;
      transition: background-color 0.4s ease;
    }

    h1 {
      color: #222;
    }

    #contenedor {
      display: flex;
      gap: 12px;
      margin: 20px 0;
    }

    .tarjeta {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      text-shadow: 0 0 3px rgba(0,0,0,0.5);
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #333;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #555;
    }

    #contador {
      margin-top: 10px;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>Generador de Paleta de Colores</h1>

  <div id="contenedor"></div>

  <button id="btnGenerar">Generar colores aleatorios</button>

  <p id="contador">Paletas generadas: 0</p>

  <script src="script.js"></script>
</body>
</html>
